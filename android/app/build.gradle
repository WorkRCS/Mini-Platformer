plugins {
    id 'com.android.application'
}

android {
    namespace 'com.workrcs.tinytrails'
    compileSdk 35
    buildToolsVersion '36.0.0'
    // Match the NDK version already installed on the developer machine.
    // An incomplete 28.2 folder caused Gradle configuration to fail.
    ndkVersion '27.0.12077973'

    sourceSets {
        main {
            assets.srcDirs = ['../../assets']
        }
    }

    defaultConfig {
        applicationId 'com.workrcs.tinytrails'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.1.0'

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
                arguments '-DPLATFORM=Android'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('../../CMakeLists.txt')
            version '4.1.2'
        }
    }
}
