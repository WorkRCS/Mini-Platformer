plugins {
    id 'com.android.application'
}

android {
    namespace 'com.workrcs.tinytrails'
    compileSdk 35

    // Bundle the same source assets used by the desktop build into the Android APK.
    sourceSets {
        main {
            assets.srcDirs = ['../../assets']
        }
    }

    defaultConfig {
        applicationId 'com.workrcs.tinytrails'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.1.0'

        // The current test target is a modern ARM64 Android phone.
        // Skipping emulator/32-bit ABIs avoids configuring and compiling raylib three times.
        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
                arguments '-DPLATFORM=Android'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('../../CMakeLists.txt')
            // Match the CMake version already available in the current Android SDK.
            version '4.1.2'
        }
    }
}
