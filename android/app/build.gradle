plugins {
    id 'com.android.application'
}

android {
    namespace 'com.workrcs.tinytrails'
    compileSdk 35

    // Bundle the same source assets used by the desktop build into the Android APK.
    sourceSets {
        main {
            assets.srcDirs = ['../../assets']
        }
    }

    defaultConfig {
        applicationId 'com.workrcs.tinytrails'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.1.0'

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
                arguments '-DPLATFORM=Android'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('../../CMakeLists.txt')
            version '3.22.1'
        }
    }
}
