plugins {
    id 'com.android.application'
}

android {
    namespace 'com.workrcs.wildbound'
    compileSdk 35
    buildToolsVersion '36.0.0'
    ndkVersion '27.0.12077973'

    sourceSets {
        main {
            // APK asset paths are relative to the repository's lowercase assets/ folder.
            assets.srcDirs = ['../../assets']
        }
    }

    defaultConfig {
        applicationId 'com.workrcs.wildbound'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.1.0'

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
                arguments '-DPLATFORM=Android'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('../../CMakeLists.txt')
            version '4.1.2'
        }
    }
}
