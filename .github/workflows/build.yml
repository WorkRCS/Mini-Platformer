name: Build Unity native gameplay core

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  native-core:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure C++ core
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build shared native plug-in and tests
        run: cmake --build build --config Release

      - name: Run C++ gameplay tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Validate Unity project scaffold
        shell: pwsh
        run: |
          $required = @(
            "Assets/Scripts/Runtime/WildboundGame.cs",
            "Assets/Scripts/Runtime/WildboundNative.cs",
            "Assets/Editor/WildboundProjectSetup.cs",
            "Assets/Editor/SketchfabAssetManagerWindow.cs",
            "Packages/manifest.json",
            "ProjectSettings/ProjectVersion.txt"
          )
          foreach ($path in $required) {
            if (!(Test-Path $path)) { throw "Missing Unity project file: $path" }
          }
          Write-Host "Unity project scaffold is present."

      - name: Package Windows native plug-in
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $plugin = Get-ChildItem build -Recurse -Filter WildboundCore.dll | Select-Object -First 1
          if (!$plugin) { throw "WildboundCore.dll not found after native build." }
          New-Item -ItemType Directory -Force -Path dist/Assets/Plugins/x86_64 | Out-Null
          Copy-Item $plugin.FullName dist/Assets/Plugins/x86_64/WildboundCore.dll
          Copy-Item NativeCore/README.md dist/README-native-core.txt

      - name: Upload Windows native plug-in
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Wildbound-Unity-NativeCore-Windows-x64
          path: dist/
          if-no-files-found: error
