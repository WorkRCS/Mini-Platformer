name: Build desktop game

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  windows-ucrt64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch optional CC0 environment and sound assets
        shell: pwsh
        continue-on-error: true
        run: ./scripts/fetch-openworld-assets.ps1

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-raylib

      - name: Configure
        shell: msys2 {0}
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: msys2 {0}
        run: cmake --build build --verbose

      - name: Package Windows PC build
        shell: msys2 {0}
        run: |
          mkdir -p dist
          cp build/TinyTrails.exe dist/
          if [ -d build/assets ]; then cp -a build/assets dist/assets; fi
          # Bundle MSYS2 runtime DLLs resolved by the built executable.
          ldd build/TinyTrails.exe | while IFS= read -r line; do
            dep="$(printf '%s\n' "$line" | sed -nE 's/.*=> (\/[^ ]+).*/\1/p')"
            if [[ "$dep" == /ucrt64/bin/* && -f "$dep" ]]; then cp -u "$dep" dist/; fi
          done
          find dist -maxdepth 1 -name '*.dll' -print

      - name: Upload Windows PC game
        uses: actions/upload-artifact@v4
        with:
          name: Wildbound-PC-Windows
          path: dist/
          if-no-files-found: error
