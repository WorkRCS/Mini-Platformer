name: Build Android APK

# PC gameplay is the current milestone. Run this workflow manually when beginning
# the Android port/optimization phase.
on:
  workflow_dispatch:

jobs:
  android-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Android SDK components
        shell: bash
        run: |
          SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | sort | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT/cmdline-tools"
            exit 1
          fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;36.0.0" "ndk;27.0.12077973" "cmake;4.1.2"

      - name: Fetch optional CC0 environment and sound assets
        shell: pwsh
        continue-on-error: true
        run: ./scripts/fetch-openworld-assets.ps1

      - name: Verify Gradle JVM
        working-directory: android
        run: ./gradlew --version

      - name: Verify NDK metadata
        shell: bash
        run: |
          test -f "$ANDROID_HOME/ndk/27.0.12077973/source.properties"
          grep -E 'Pkg.Revision' "$ANDROID_HOME/ndk/27.0.12077973/source.properties"

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Verify NativeActivity entry point in APK
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          LIB="$RUNNER_TEMP/libmain.so"
          LLVM_NM="$ANDROID_HOME/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          unzip -p "$APK" lib/arm64-v8a/libmain.so > "$LIB"
          "$LLVM_NM" -D --defined-only "$LIB" | tee "$RUNNER_TEMP/libmain-symbols.txt"
          grep -Fq "ANativeActivity_onCreate" "$RUNNER_TEMP/libmain-symbols.txt"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Wildbound-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
